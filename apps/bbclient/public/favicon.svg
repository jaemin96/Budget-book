<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background Circle -->
  <circle cx="16" cy="16" r="16" fill="#121212"/>
  
  <!-- Wallet/Ledger Shape -->
  <rect x="8" y="10" width="16" height="12" rx="2" fill="#2a2a2a" stroke="#ff9208" stroke-width="1.5"/>
  
  <!-- Money Symbol (₩ or $) -->
  <path d="M13 13 L15 18 M17 13 L15 18 M19 13 L17 18" stroke="#ffd36e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="12" y1="15" x2="20" y2="15" stroke="#ffd36e" stroke-width="1.2"/>
  <line x1="12" y1="16.5" x2="20" y2="16.5" stroke="#ffd36e" stroke-width="1.2"/>
  
  <!-- Chart/Graph Indicator (Bottom accent) -->
  <path d="M10 20 L12 18 L14 19 L16 17 L18 18.5 L20 17" stroke="#ff9208" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Corner Accent Dots -->
  <circle cx="10" cy="12" r="1" fill="#ff9208"/>
  <circle cx="22" cy="12" r="1" fill="#ff9208"/>
</svg>
