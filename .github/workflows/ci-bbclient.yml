name: bbclient CI

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

env:
  NODE_ENV: production
  NODE_VERSION: 22

jobs:
  check-changes:
    name: Check if bbclient changed
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    outputs:
      should_run: ${{ steps.filter.outputs.bbclient }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Check for changes
        uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            bbclient:
              - 'apps/bbclient/**'
              - 'pnpm-lock.yaml'

      - name: Force run on main PR
        id: force_main
        run: |
          if [[ "${{ github.base_ref }}" == "main" ]]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=${{ steps.filter.outputs.bbclient }}" >> $GITHUB_OUTPUT
          fi

  install:
    name: Install & Cache (bbclient)
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.should_run == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2

      - name: Install dependencies (filtered)
        run: pnpm install

      - name: Cache node_modules for bbclient
        uses: actions/cache@v3
        with:
          path: apps/bbclient/node_modules
          key: ${{ runner.os }}-node-modules-bbclient-${{ hashFiles('pnpm-lock.yaml') }}

  lint:
    name: Lint (bbclient)
    runs-on: ubuntu-latest
    needs: [check-changes, install]
    if: needs.check-changes.outputs.should_run == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Restore node_modules cache for bbclient
        uses: actions/cache@v3
        with:
          path: apps/bbclient/node_modules
          key: ${{ runner.os }}-node-modules-bbclient-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2

      - run: pnpm install --frozen-lockfile
      - name: Lint bbclient
        run: pnpm lint

  build:
    name: Build (bbclient)
    runs-on: ubuntu-latest
    needs: [check-changes, install, lint]
    if: needs.check-changes.outputs.should_run == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Restore node_modules cache for bbclient
        uses: actions/cache@v3
        with:
          path: apps/bbclient/node_modules
          key: ${{ runner.os }}-node-modules-bbclient-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2

      - run: pnpm install --frozen-lockfile
      - name: Build bbclient
        run: pnpm build
        working-directory: apps/bbclient
