name: bbclient CI

on:
  pull_request:
    paths:
      - "packages/bbclient/**"
      - "pnpm-lock.yaml"
    branches:
      - main
      - dev
  push:
    paths:
      - "packages/bbclient/**"
      - "pnpm-lock.yaml"
    branches:
      - main
      - dev

env:
  NODE_ENV: production
  NODE_VERSION: 22
  PNPM_VERSION: 10

jobs:
  install:
    name: Install & Cache (bbclient)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies (filtered)
        run: pnpm install

      - name: Cache node_modules for bbclient
        uses: actions/cache@v3
        with:
          path: packages/bbclient/node_modules
          key: ${{ runner.os }}-node-modules-bbclient-${{ hashFiles('packages/bbclient/pnpm-lock.yaml') }}

  lint:
    name: Lint (bbclient)
    runs-on: ubuntu-latest
    needs: install

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Restore node_modules cache for bbclient
        uses: actions/cache@v3
        with:
          path: packages/bbclient/node_modules
          key: ${{ runner.os }}-node-modules-bbclient-${{ hashFiles('packages/bbclient/pnpm-lock.yaml') }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - run: pnpm install --frozen-lockfile
      - name: Lint bbclient
        run: pnpm lint

  build:
    name: Build (bbclient)
    runs-on: ubuntu-latest
    needs: [install, lint]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Restore node_modules cache for bbclient
        uses: actions/cache@v3
        with:
          path: packages/bbclient/node_modules
          key: ${{ runner.os }}-node-modules-bbclient-${{ hashFiles('packages/bbclient/pnpm-lock.yaml') }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - run: pnpm install --frozen-lockfile
      - name: Build bbclient
        run: pnpm build
        working-directory: packages/bbclient
