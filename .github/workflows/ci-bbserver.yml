name: bbserver CI

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev
      - test-server

env:
  NODE_ENV: production
  NODE_VERSION: 22
  PNPM_VERSION: 10

jobs:
  check-changes:
    name: Check if bbserver changed
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    outputs:
      should_run: ${{ steps.filter.outputs.bbserver }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Check for changes
        uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            bbserver:
              - 'apps/bbserver/**'
              - 'pnpm-lock.yaml'

      - name: Force run on main PR
        id: force_main
        run: |
          if [[ "${{ github.base_ref }}" == "main" ]]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=${{ steps.filter.outputs.bbserver }}" >> $GITHUB_OUTPUT
          fi

  install:
    name: Install & Cache (bbserver)
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.should_run == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies (filtered)
        run: pnpm install

      - name: Cache node_modules for bbserver
        uses: actions/cache@v3
        with:
          path: apps/bbserver/node_modules
          key: ${{ runner.os }}-node-modules-bbserver-${{ hashFiles('pnpm-lock.yaml') }}

  lint:
    name: Lint (bbserver)
    runs-on: ubuntu-latest
    needs: [check-changes, install]
    if: needs.check-changes.outputs.should_run == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Restore node_modules cache for bbserver
        uses: actions/cache@v3
        with:
          path: apps/bbserver/node_modules
          key: ${{ runner.os }}-node-modules-bbserver-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - run: pnpm install --frozen-lockfile
      - name: Lint bbserver
        run: pnpm lint

  build:
    name: Build (bbserver)
    runs-on: ubuntu-latest
    needs: [check-changes, install, lint]
    if: needs.check-changes.outputs.should_run == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Restore node_modules cache for bbserver
        uses: actions/cache@v3
        with:
          path: apps/bbserver/node_modules
          key: ${{ runner.os }}-node-modules-bbserver-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - run: pnpm install --frozen-lockfile

      # prisma setting options
      - name: Set up .env
        run: |
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env
          echo "DIRECT_URL=${{ secrets.DIRECT_URL }}" >> .env
        working-directory: apps/bbserver

      - name: Generate Prisma client
        run: pnpm prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        working-directory: apps/bbserver

      - name: Migrate database (optional, if needed)
        run: pnpm prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        working-directory: apps/bbserver

      # All pass - build
      - name: Build bbserver
        run: pnpm build
        working-directory: apps/bbserver
