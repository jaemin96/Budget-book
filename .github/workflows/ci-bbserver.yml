name: bbserver CI

on:
  pull_request:
    paths:
      - "packages/bbserver/**"
      - "pnpm-lock.yaml"
    branches:
      - main
      - dev
  push:
    paths:
      - "packages/bbserver/**"
      - "pnpm-lock.yaml"
    branches:
      - main
      - dev
      - test-server

env:
  NODE_ENV: production
  NODE_VERSION: 22
  PNPM_VERSION: 10

jobs:
  install:
    name: Install & Cache (bbserver)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies (filtered)
        run: pnpm install

      - name: Cache node_modules for bbserver
        uses: actions/cache@v3
        with:
          path: packages/bbserver/node_modules
          key: ${{ runner.os }}-node-modules-bbserver-${{ hashFiles('packages/bbserver/pnpm-lock.yaml') }}

  lint:
    name: Lint (bbserver)
    runs-on: ubuntu-latest
    needs: install

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Restore node_modules cache for bbserver
        uses: actions/cache@v3
        with:
          path: packages/bbserver/node_modules
          key: ${{ runner.os }}-node-modules-bbserver-${{ hashFiles('packages/bbserver/pnpm-lock.yaml') }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - run: pnpm install --frozen-lockfile
      - name: Lint bbserver
        run: pnpm lint

  build:
    name: Build (bbserver)
    runs-on: ubuntu-latest
    needs: [install, lint]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Restore node_modules cache for bbserver
        uses: actions/cache@v3
        with:
          path: packages/bbserver/node_modules
          key: ${{ runner.os }}-node-modules-bbserver-${{ hashFiles('packages/bbserver/pnpm-lock.yaml') }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - run: pnpm install --frozen-lockfile

      # prisma setting options
      - name: Set up .env
        run: |
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env
          echo "DIRECT_URL=${{ secrets.DIRECT_URL }}" >> .env
        working-directory: packages/bbserver

      - name: Generate Prisma client
        run: pnpm prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        working-directory: packages/bbserver

      - name: Migrate database (optional, if needed)
        run: pnpm prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        working-directory: packages/bbserver

      # All pass - build
      - name: Build bbserver
        run: pnpm build
        working-directory: packages/bbserver
