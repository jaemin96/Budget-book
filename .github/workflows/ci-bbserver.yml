name: bbserver CI

on:
  pull_request:
    paths:
      - "packages/bbserver/**"
      - "pnpm-lock.yaml"
    branches:
      - main
      - dev
  push:
    paths:
      - "packages/bbserver/**"
      - "pnpm-lock.yaml"
    branches:
      - main
      - dev
      - test-server

env:
  NODE_ENV: production
  NODE_VERSION: 22
  PNPM_VERSION: 10

jobs:
  install:
    name: Install & Cache (bbserver)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies (filtered)
        run: pnpm install

      - name: Cache node_modules for bbserver
        uses: actions/cache@v3
        with:
          path: packages/bbserver/node_modules
          key: ${{ runner.os }}-node-modules-bbserver-${{ hashFiles('packages/bbserver/pnpm-lock.yaml') }}
