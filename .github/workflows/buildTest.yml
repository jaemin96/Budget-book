name: 'build test before merge'

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - dev

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - uses: pnpm/action-setup@v2
        name: Install pnpm
        with:
          version: 10
          run_install: false

      - name: Install dependencies
        run: pnpm install

      # Step - test lint
      - name: Testing Lint
        id: Lint-Test
        run: pnpm lint
        if: ${{ always() }}

      # Step - test build
      - name: Testing Build
        id: Build-Test
        run: |
          pnpm build
        if: ${{ always() }}
